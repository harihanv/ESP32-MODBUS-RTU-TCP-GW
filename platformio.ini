[platformio]
default_envs = esp32s3_rs485_can

[env]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    esp32async/AsyncTCP @ ^3.3.0
    esp32async/ESPAsyncWebServer @ ^3.6.0
    https://github.com/eModbus/eModbus.git#v1.7.6.stable
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096

[env:esp32_usb]
board_build.partitions = partitions_4mb.csv
board_upload.flash_size = 4MB
board_upload.offset_address = 0x20000
upload_speed = 921600

[env:esp32s3_rs485_can]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.partitions = partitions_ota.csv
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D ARDUINO_USB_CDC_ON_BOOT=1